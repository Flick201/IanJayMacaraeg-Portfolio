<script>
(function() {
  // -------------------------------------------------------
  // EDIT THESE — in top-to-bottom visual order on the page
  // -------------------------------------------------------
  const buttonTexts = [
    "In - Person Workshop\nDate: March 11-15, 2026\nParticipants: 1\n\n$1500",
    "In - Person Workshop\nDate: March 11-15, 2026\nParticipants: 1\n\n$1500",
    "In - Person Workshop\nDate: March 11-15, 2026\nParticipants: 1\n\n$1500",
    "In - Person Workshop\nDate: September 9-13, 2026\nParticipants: 1\n\n$1500",
    "In - Person Workshop\nDate: September 30-October 3, 2026\nParticipants: 1\n\n$1500",
  ];
  // -------------------------------------------------------

  const BUTTON_SELECTOR = '.lightbox-handle.sqs-system-button.sqs-editable-button.sqs-button-element--primary';
  const TEXTAREA_ID     = 'textarea-0236d423-9560-4eb0-82d6-a3419cb9502d-field';
  const DATA_ATTR       = 'data-ascendyx-index';

  let activeText    = null;
  let lockInterval  = null;
  let buttonsTagged = false;

  // --- Helper: absolute document top ---
  function getDocumentTop(el) {
    let top = 0;
    let node = el;
    while (node) {
      top += node.offsetTop || 0;
      node = node.offsetParent;
    }
    return top;
  }

  // --- Helper: is element truly hidden via CSS ---
  function isHidden(el) {
    let node = el;
    while (node && node !== document.body) {
      const style = window.getComputedStyle(node);
      if (
        style.display === 'none' ||
        style.visibility === 'hidden' ||
        style.opacity === '0'
      ) return true;
      node = node.parentElement;
    }
    const rect = el.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) return true;
    return false;
  }

  // --- 1. Tag visible buttons sorted top to bottom ---
  function tagButtons() {
    if (buttonsTagged) return;

    const all = Array.from(document.querySelectorAll(BUTTON_SELECTOR));
    console.log(`[AscendyX] Raw button count: ${all.length}`);

    const visible = all.filter(el => !isHidden(el));
    console.log(`[AscendyX] Visible button count after filter: ${visible.length}`);

    if (visible.length === 0) return;

    visible.sort((a, b) => getDocumentTop(a) - getDocumentTop(b));

    visible.forEach((btn, i) => {
      btn.setAttribute(DATA_ATTR, i);
      console.log(`[AscendyX] Tagged button ${i} | docTop: ${getDocumentTop(btn)} | size: ${Math.round(btn.getBoundingClientRect().width)}x${Math.round(btn.getBoundingClientRect().height)}`);
    });

    buttonsTagged = true;
    console.log(`[AscendyX] Tagging complete. ${visible.length} button(s) tagged.`);
  }

  // --- 2. Apply lock to textarea ---
  function applyTextareaLock(text) {
    const textarea = document.querySelector(`textarea#${TEXTAREA_ID}`);
    if (!textarea) return false;
    if (textarea.value !== text) textarea.value = text;
    textarea.readOnly = true;
    textarea.style.setProperty('overflow',         'hidden',      'important');
    textarea.style.setProperty('resize',           'none',        'important');
    textarea.style.setProperty('pointer-events',   'none',        'important');
    textarea.style.setProperty('height',           '135px',       'important');
    textarea.style.setProperty('background-color', 'transparent', 'important');
    textarea.style.setProperty('user-select',      'none',        'important');
    return true;
  }

  // --- 3. Watch for textarea and lock it ---
  function waitForTextareaAndLock(text) {
    activeText = text;
    if (lockInterval) clearInterval(lockInterval);

    applyTextareaLock(text);

    const formObserver = new MutationObserver(() => {
      const textarea = document.querySelector(`textarea#${TEXTAREA_ID}`);
      if (textarea) {
        applyTextareaLock(text);
        console.log('[AscendyX] Textarea detected — text applied.');
      }
    });

    formObserver.observe(document.body, { childList: true, subtree: true });

    lockInterval = setInterval(() => {
      if (activeText) applyTextareaLock(activeText);
    }, 300);

    setTimeout(() => formObserver.disconnect(), 5000);
  }

  // --- 4. Stop lock ---
  function stopLock() {
    if (lockInterval) clearInterval(lockInterval);
    lockInterval = null;
    activeText   = null;
  }

  // --- 5. Unified handler for both click and touch ---
  function handleInteraction(e) {
    const btn = e.target.closest(`[${DATA_ATTR}]`);
    if (!btn) return;

    const index = parseInt(btn.getAttribute(DATA_ATTR), 10);
    const text  = buttonTexts[index];

    console.log(`[AscendyX] Interaction on button ${index} | event: ${e.type}`);

    if (text !== undefined) {
      waitForTextareaAndLock(text);
    } else {
      console.warn(`[AscendyX] Button ${index} — no text defined.`);
    }
  }

  // Listen for both click and touchend to cover all devices
  document.addEventListener('click',    handleInteraction, true);
  document.addEventListener('touchend', handleInteraction, true);

  // --- 6. Watch for lightbox close ---
  function observeLightboxClose() {
    const observer = new MutationObserver(() => {
      const lightbox = document.querySelector('.lightbox-container, .sqs-lightbox, [class*="lightbox-overlay"]');
      if (!lightbox && activeText) stopLock();
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  // --- Init with retries ---
  function init() {
    tagButtons();
    observeLightboxClose();

    if (!buttonsTagged) {
      window.addEventListener('load', () => {
        console.log('[AscendyX] Retrying tag on load...');
        tagButtons();
        if (!buttonsTagged) {
          setTimeout(() => {
            console.log('[AscendyX] Retrying tag after 2s...');
            tagButtons();
          }, 2000);
        }
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

<script>
/**
 * Enforces the Inter font on elements matching a selector.
 * It ensures the font is loaded and applied with high priority.
 */
function enforceInterFont(selector) {
  // 1. Ensure the font is imported
  if (!document.getElementById('google-font-inter')) {
    const link = document.createElement('link');
    link.id = 'google-font-inter';
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap';
    document.head.appendChild(link);
  }

  // 2. Apply style to all matching elements
  const elements = document.querySelectorAll(selector);
  elements.forEach(el => {
    el.style.setProperty('font-family', "'Inter', sans-serif", 'important');
  });
}

// Call the function
enforceInterFont('span.sqsrte-text-color--custom.ai-style-change-1');
