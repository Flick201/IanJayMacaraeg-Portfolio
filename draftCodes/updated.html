<script>
  (function() {
    function initProductLayout() {
      const parent = document.querySelector('.product-meta');
      const realButtonWrapper = document.querySelector('.product-add-to-cart-button-wrapper');
      const container = document.querySelector('.dedicated-inquiry-container');
      
      if (parent && !container) {
        const newContainer = document.createElement('div');
        newContainer.className = 'dedicated-inquiry-container';
        parent.appendChild(newContainer);
      }

      const inquiryContainer = document.querySelector('.dedicated-inquiry-container');

      if (inquiryContainer && realButtonWrapper && !document.getElementById('proxy-inquiry-button')) {
        realButtonWrapper.style.display = 'none';
        const realButton = realButtonWrapper.querySelector('.sqs-add-to-cart-button');
        const proxyBtn = realButton.cloneNode(true);
        proxyBtn.id = 'proxy-inquiry-button';
        inquiryContainer.appendChild(proxyBtn);
        proxyBtn.addEventListener('click', (e) => {
          e.preventDefault();
          realButton.click();
        });
      }
    }

    window.addEventListener('load', initProductLayout);
    window.addEventListener('DOMContentLoaded', initProductLayout);
    document.addEventListener('readystatechange', initProductLayout);
  })();
</script>

<script>
(function() {
  const targetFieldId = 'textarea-dd923970-ab32-4c95-be0c-bacf3f7075e5-field';
  const containerId = 'textarea-dd923970-ab32-4c95-be0c-bacf3f7075e5';

  const updateFormProductDetails = () => {
    const container = document.getElementById(containerId);
    const textarea = document.getElementById(targetFieldId);
    if (!container || !textarea) return;

    if (!document.getElementById('textarea-image-wrapper')) {
      const rawImg = document.querySelector('.product-gallery-slides-item-image, .main-image img')?.src;
      const imageUrl = rawImg ? rawImg.split('?')[0] + '?format=300w' : '';
      if (imageUrl) {
        const wrapper = document.createElement('div');
        wrapper.id = 'textarea-image-wrapper';
        wrapper.innerHTML = `<img src="${imageUrl}" alt="Product Preview">`;
        container.style.display = 'flex';
        container.style.flexDirection = 'row';
        container.style.alignItems = 'center';
        container.style.paddingLeft = '20px';
        container.style.flexWrap = 'wrap';
        const label = container.querySelector('label');
        if (label) label.style.display = 'none';
        container.insertBefore(wrapper, textarea);
      }
    }

    textarea.readOnly = true;

    const size = document.querySelector('select[name="variant-option-Size-select"]')?.value || 'Medium';
    const color = document.querySelector('select[name="variant-option-Color-select"]')?.value || 'Mahogany';
    const quantity = document.querySelector('input[name="quantity-input"]')?.value || '1';
    const rawTitle = document.querySelector('.product-title, h1')?.innerText || 'Product';
    const title = rawTitle.split('-')[0].trim();
    const formattedValue = `${quantity}x ${title} | ${color}\n${size}\n30kg`;
    if (textarea.value !== formattedValue) {
      textarea.value = formattedValue;
      textarea.dispatchEvent(new Event('input', { bubbles: true }));
    }
  };

  setInterval(updateFormProductDetails, 500);

  document.body.addEventListener('input', (e) => {
    const names = ['variant-option-Size-select', 'variant-option-Color-select', 'quantity-input'];
    if (names.includes(e.target.name)) updateFormProductDetails();
  });
})();
</script>

<script>
(function() {
  const textures = {
    'Maple': "url('https://images.squarespace-cdn.com/content/643d86886a79347f5a2fbe24/e7c10c9f-eca4-4b2d-b74b-757648aa80c4/maple-texture.jpg')",
    'Walnut': "url('https://images.squarespace-cdn.com/content/643d86886a79347f5a2fbe24/a6d9bc5c-d52f-4919-8fed-b09ec8931e48/walnut-wood-texture.jpg')",
    'Mahogany': "url('https://images.squarespace-cdn.com/content/643d86886a79347f5a2fbe24/9275f6a3-d1e0-428d-9f9f-fbb81092c97d/walnut-wood-textured.jpg')"
  };

  const nukeColorSelect = (doc) => {
    const sel = doc.querySelector('select[name="variant-option-Color-select"]');
    if (!sel) return;
    sel.style.cssText = 'display:none!important;visibility:hidden!important;';
    let wrapper = sel.parentElement;
    for (let i = 0; i < 4; i++) {
      if (!wrapper) break;
      wrapper.style.border = 'none';
      wrapper.style.background = 'none';
      wrapper.style.backgroundImage = 'none';
      wrapper.style.boxShadow = 'none';
      wrapper.style.outline = 'none';
      wrapper.classList.forEach(cls => {
        if (/caret|arrow|indicator|select/i.test(cls)) wrapper.style.setProperty('--sq-caret', 'none');
      });
      Array.from(wrapper.children).forEach(child => {
        if (child !== sel && (child.tagName === 'svg' || /caret|arrow|icon/i.test(child.className))) child.style.display = 'none';
      });
      wrapper = wrapper.parentElement;
    }
  };

  const groupPriceAndDetails = (doc) => {
    if (doc.getElementById('product-price-and-details-container')) return;
    const detailPreview = doc.getElementById('dynamic-product-details-preview');
    const productPrice  = doc.querySelector('#main-product-price, .product-price');
    if (!detailPreview || !productPrice) return;
    const container = doc.createElement('div');
    container.id = 'product-price-and-details-container';
    detailPreview.parentNode.insertBefore(container, detailPreview);
    container.appendChild(detailPreview);
    container.appendChild(productPrice);
  };

  const enforceOrder = (doc) => {
    const title       = doc.querySelector('h1.product-title');
    const group       = doc.getElementById('product-price-and-details-container');
    const description = doc.querySelector('.product-description.hidden-down-md.ai-style-change-7');
    const gallery     = doc.querySelector('.product-gallery');
    if (!title) return;
    const parent = title.parentElement;
    if (!parent) return;

    if (window.innerWidth > 768) {
      // Desktop — leave gallery where Squarespace puts it
      parent.style.display = 'grid';
      parent.style.gridTemplateColumns = '1fr';
      if (title)       { title.style.gridRow = '1'; title.style.order = '1'; }
      if (group)       { group.style.gridRow = '2'; group.style.order = '2'; group.style.gridColumn = '1 / -1'; }
      if (description) { description.style.gridRow = '3'; description.style.order = '3'; }
      if (gallery)     { gallery.style.gridRow = ''; gallery.style.gridColumn = ''; gallery.style.order = ''; }
    } else {
      // Mobile — CSS handles flex order, JS handles physical DOM move
      parent.style.display = 'flex';
      parent.style.flexDirection = 'column';
      parent.style.gridTemplateColumns = '';
      if (title)       { title.style.gridRow = ''; title.style.order = '2'; }
      if (group)       { group.style.gridRow = ''; group.style.gridColumn = ''; group.style.order = '3'; }
      if (gallery)     { gallery.style.gridRow = ''; gallery.style.gridColumn = ''; gallery.style.order = '1'; }
      if (description) { description.style.gridRow = ''; description.style.order = '4'; }
    }
  };

  // ── Mobile DOM reorder — physically moves elements ───────────────────────
  const mobileReorder = (doc) => {
    if (window.innerWidth > 768) return;

    const title       = doc.querySelector('h1.product-title');
    const group       = doc.getElementById('product-price-and-details-container');
    const description = doc.querySelector('.product-description.hidden-down-md.ai-style-change-7');
    const gallery     = doc.querySelector('.product-gallery');

    if (!title || !gallery) return;

    const detailsParent = title.parentElement;
    const galleryParent = gallery.parentElement;
    if (!detailsParent) return;

    // Already reordered — skip
    if (detailsParent.dataset.mobileReordered === 'true') return;

    if (galleryParent === detailsParent) {
      // Same parent — reorder within it
      detailsParent.insertBefore(gallery, detailsParent.firstChild);
      if (title) gallery.after(title);
      if (group) title.after(group);
      if (description && group) group.after(description);
    } else {
      // Different parent — move gallery before the details parent
      detailsParent.parentElement?.insertBefore(gallery, detailsParent);
    }

    detailsParent.dataset.mobileReordered = 'true';
  };

  const updateAll = (doc) => {
    nukeColorSelect(doc);

    const colorSelect = doc.querySelector('select[name="variant-option-Color-select"]');
    if (colorSelect && !doc.getElementById('custom-swatch-wrapper')) {
      const wrapper = doc.createElement('div');
      wrapper.id = 'custom-swatch-wrapper';
      wrapper.className = 'custom-swatch-container';
      Object.entries(textures).forEach(([name, url]) => {
        const swatch = doc.createElement('div');
        swatch.className = 'swatch-item' + (colorSelect.value === name ? ' active' : '');
        swatch.style.backgroundImage = url;
        swatch.title = name;
        swatch.onclick = () => {
          colorSelect.value = name;
          colorSelect.dispatchEvent(new Event('change', { bubbles: true }));
          doc.querySelectorAll('.swatch-item').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
        };
        wrapper.appendChild(swatch);
      });
      colorSelect.parentNode.appendChild(wrapper);
    }

    const titleEl = doc.querySelector('h1.product-title');
    const priceEl = doc.querySelector('#main-product-price, .product-price');
    if (titleEl && priceEl) {
      let preview = doc.getElementById('dynamic-product-details-preview');
      if (!preview) {
        preview = doc.createElement('div');
        preview.id = 'dynamic-product-details-preview';
        priceEl.parentNode.insertBefore(preview, priceEl);
      }
      const size     = doc.querySelector('select[name="variant-option-Size-select"]')?.value || 'Medium';
      const color    = colorSelect?.value || 'Mahogany';
      const quantity = doc.querySelector('input[name="quantity-input"]')?.value || '1';
      preview.innerText = `${color}\n${size}\n30kg`;

      const textarea = doc.getElementById('textarea-dd923970-ab32-4c95-be0c-bacf3f7075e5-field');
      if (textarea) {
        const text = `${quantity}x ${titleEl.innerText.split('-')[0].trim()} | ${color}\n${size}\n30kg`;
        if (textarea.value !== text) {
          textarea.value = text;
          textarea.dispatchEvent(new Event('input', { bubbles: true }));
        }
        const container = doc.getElementById('textarea-dd923970-ab32-4c95-be0c-bacf3f7075e5');
        if (container && !doc.getElementById('textarea-image-wrapper')) {
          const img = doc.querySelector('.product-gallery-slides-item-image, .main-image img')?.src;
          if (img) {
            const wrap = doc.createElement('div'); wrap.id = 'textarea-image-wrapper';
            wrap.innerHTML = `<img src="${img.split('?')[0]}?format=300w">`;
            container.style.cssText = "display:flex; align-items:center; padding-left:20px; flex-wrap:wrap;";
            container.querySelector('label').style.display = 'none';
            container.insertBefore(wrap, textarea);
          }
          textarea.readOnly = true;
        }
      }
    }

    groupPriceAndDetails(doc);
    enforceOrder(doc);
    mobileReorder(doc);
  };

  window.addEventListener('resize', () => {
    // Reset mobile reorder flag on resize so it can re-evaluate
    const detailsParent = document.querySelector('h1.product-title')?.parentElement;
    if (detailsParent) detailsParent.removeAttribute('data-mobile-reordered');
    updateAll(document);
  });

  const run = () => {
    updateAll(document);
    const iframe = document.querySelector('iframe.config-website-frame');
    if (iframe && iframe.contentDocument) updateAll(iframe.contentDocument);
  };
  setInterval(run, 500);
})();
</script>

<script>
(function() {

  const TRACK_SELECTOR = [
    '.product-gallery-slides',
    '.ProductGallery-slides',
    '[class*="product-gallery-slides"]'
  ].join(', ');

  const SLIDE_SELECTOR = '.product-gallery-slides-item';

  const forceLoadImages = (el) => {
    el.querySelectorAll('img').forEach(img => {
      if (img.dataset.src)  { img.src = img.dataset.src;  img.removeAttribute('data-src'); }
      if (img.dataset.lazy) { img.src = img.dataset.lazy; img.removeAttribute('data-lazy'); }
      img.removeAttribute('loading');
    });
  };

  const pairSlidesInDOM = (track) => {
    if (track.dataset.paired) return;
    const slides = Array.from(track.querySelectorAll(SLIDE_SELECTOR));
    if (!slides.length) return;
    slides.forEach(forceLoadImages);
    slides.forEach(slide => slide.parentNode && slide.parentNode.removeChild(slide));
    for (let i = 0; i < slides.length; i += 2) {
      const wrapper = document.createElement('div');
      wrapper.className = 'paired-slide-wrapper';
      const first = slides[i];
      forceLoadImages(first);
      wrapper.appendChild(first);
      if (slides[i + 1]) {
        const second = slides[i + 1];
        forceLoadImages(second);
        wrapper.appendChild(second);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'paired-slide-placeholder';
        wrapper.appendChild(placeholder);
      }
      track.appendChild(wrapper);
    }
    track.dataset.paired = 'true';
  };

  let isAutoTriggering = false;

  const triggerPrev = (delay = 0) => {
    setTimeout(() => {
      const track = document.querySelector(TRACK_SELECTOR);
      if (track && window.Flickity) {
        const inst = Flickity.data(track);
        if (inst) {
          isAutoTriggering = true;
          inst.previous();
          setTimeout(() => { isAutoTriggering = false; }, 400);
          return;
        }
      }
      const prevBtn = document.querySelector('.flickity-prev-next-button.previous, [aria-label="Previous"], .product-gallery-prev, [class*="product-gallery-prev"]');
      if (prevBtn) { isAutoTriggering = true; prevBtn.click(); setTimeout(() => { isAutoTriggering = false; }, 400); }
    }, delay);
  };

  const triggerNext = (delay = 0) => {
    setTimeout(() => {
      const track = document.querySelector(TRACK_SELECTOR);
      if (track && window.Flickity) {
        const inst = Flickity.data(track);
        if (inst) {
          isAutoTriggering = true;
          inst.next();
          setTimeout(() => { isAutoTriggering = false; }, 400);
          return;
        }
      }
      const nextBtn = document.querySelector('.flickity-prev-next-button.next, [aria-label="Next"], .product-gallery-next, [class*="product-gallery-next"]');
      if (nextBtn) { isAutoTriggering = true; nextBtn.click(); setTimeout(() => { isAutoTriggering = false; }, 400); }
    }, delay);
  };

  let nextBtnPollAttempts = 0;
  const hookNextButtonWithRetry = () => {
    if (window.__nextBtnHooked) return;
    const nextBtn = document.querySelector('.flickity-prev-next-button.next, [aria-label="Next"], .product-gallery-next, [class*="product-gallery-next"]');
    if (nextBtn) {
      window.__nextBtnHooked = true;
      document.addEventListener('click', (e) => {
        if (isAutoTriggering) return;
        const btn = e.target.closest('.flickity-prev-next-button.next, [aria-label="Next"], .product-gallery-next, [class*="product-gallery-next"]');
        if (btn) { triggerNext(800); triggerPrev(1600); }
      }, true);
      return;
    }
    nextBtnPollAttempts++;
    if (nextBtnPollAttempts < 60) setTimeout(hookNextButtonWithRetry, 200);
  };

  const initAutoNav = () => {
    const track = document.querySelector(TRACK_SELECTOR);
    if (!track) return;
    if (!track.dataset.autoNavDone) {
      track.dataset.autoNavDone = 'true';
      triggerNext(900);
      triggerPrev(1700);
    }
    hookNextButtonWithRetry();
  };

  const interceptFlickity = () => {
    if (!window.Flickity || window.Flickity.__paired_intercepted) return;
    const OriginalFlickity = window.Flickity;
    function PatchedFlickity(element, options) {
      const el = typeof element === 'string' ? document.querySelector(element) : element;
      if (el && el.matches && el.matches(TRACK_SELECTOR)) pairSlidesInDOM(el);
      return new OriginalFlickity(el || element, options);
    }
    Object.keys(OriginalFlickity).forEach(key => { PatchedFlickity[key] = OriginalFlickity[key]; });
    PatchedFlickity.prototype = OriginalFlickity.prototype;
    PatchedFlickity.__paired_intercepted = true;
    window.Flickity = PatchedFlickity;
  };

  let interceptAttempts = 0;
  const interceptPoll = setInterval(() => {
    interceptAttempts++;
    if (window.Flickity && !window.Flickity.__paired_intercepted) { interceptFlickity(); clearInterval(interceptPoll); return; }
    if (window.Flickity?.__paired_intercepted) { clearInterval(interceptPoll); return; }
    if (interceptAttempts > 100) clearInterval(interceptPoll);
  }, 100);

  const fallbackPatch = (doc) => {
    const track = doc.querySelector(TRACK_SELECTOR);
    if (!track || track.dataset.paired) return;
    if (window.Flickity) {
      try { const inst = Flickity.data(track); if (inst) inst.destroy(); } catch(e) {}
    }
    pairSlidesInDOM(track);
    if (window.Flickity) {
      setTimeout(() => {
        try {
          const inst = new window.Flickity(track, {
            cellAlign: 'left', contain: true, wrapAround: true,
            pageDots: true, prevNextButtons: true, adaptiveHeight: false,
            imagesLoaded: true, percentPosition: true
          });
          setTimeout(() => { inst.resize(); inst.reposition(); initAutoNav(); }, 150);
        } catch(e) {}
      }, 50);
    }
  };

  window.addEventListener('squarespace:ui-refresh', () => {
    const track = document.querySelector(TRACK_SELECTOR);
    if (track) { track.removeAttribute('data-paired'); track.removeAttribute('data-auto-nav-done'); track.removeAttribute('data-last-index'); }
    window.__nextBtnHooked = false;
    setTimeout(() => fallbackPatch(document), 300);
  });

  document.addEventListener('squarespace:ready', () => {
    setTimeout(() => { fallbackPatch(document); initAutoNav(); }, 300);
  });

  window.addEventListener('load', () => {
    setTimeout(() => { fallbackPatch(document); initAutoNav(); }, 800);
    setTimeout(() => { fallbackPatch(document); initAutoNav(); }, 2000);
  });

  const startObserver = () => {
    const target = document.body || document.documentElement;
    if (!target) return;
    const observer = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        for (const node of mutation.addedNodes) {
          if (node.nodeType !== 1) continue;
          const track = node.matches?.(TRACK_SELECTOR) ? node : node.querySelector?.(TRACK_SELECTOR);
          if (track && !track.dataset.paired) {
            setTimeout(() => { fallbackPatch(document); initAutoNav(); }, 600);
            return;
          }
        }
      }
    });
    observer.observe(target, { childList: true, subtree: true });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startObserver);
  } else {
    startObserver();
  }

})();
</script>
