<script>
(function() {
  const buttonTexts = [
    "In - Person Workshop\nDate: March 11-15, 2026\nParticipants: 1\n\n$1500",
    "In - Person Workshop\nDate: March 11-15, 2026\nParticipants: 1\n\n$1500",
    "In - Person Workshop\nDate: March 11-15, 2026\nParticipants: 1\n\n$1500",
    "In - Person Workshop\nDate: September 9-13, 2026\nParticipants: 1\n\n$1500",
    "In - Person Workshop\nDate: September 30-October 3, 2026\nParticipants: 1\n\n$1500",
  ];

  const BUTTON_SELECTOR = '.lightbox-handle.sqs-system-button.sqs-editable-button.sqs-button-element--primary';
  const TEXTAREA_ID     = 'textarea-0236d423-9560-4eb0-82d6-a3419cb9502d-field';
  const LIGHTBOX_SEL    = '.sqs-modal-lightbox, .sqs-slide-container, [class*="lightbox"], [class*="modal"]';
  const DATA_ATTR       = 'data-ascendyx-index';

  let activeText    = null;
  let lockInterval  = null;
  let buttonsTagged = false;
  let lastViewport  = null; // ← NEW

  // ── Helpers ───────────────────────────────────────────────────────────────
  function getDocumentTop(el) {
    let top = 0, node = el;
    while (node) { top += node.offsetTop || 0; node = node.offsetParent; }
    return top;
  }

  function isHidden(el) {
    let node = el;
    while (node && node !== document.body) {
      const s = window.getComputedStyle(node);
      if (s.display === 'none' || s.visibility === 'hidden' || s.opacity === '0') return true;
      node = node.parentElement;
    }
    const r = el.getBoundingClientRect();
    return r.width === 0 && r.height === 0;
  }

  // ── UPDATED tagButtons — viewport-aware ───────────────────────────────────
  function tagButtons() {
    const currentViewport = window.innerWidth > 768 ? 'desktop' : 'mobile';

    // Re-tag if viewport changed or not yet tagged
    if (buttonsTagged && currentViewport === lastViewport) return;

    // Clear previous tags
    document.querySelectorAll(`[${DATA_ATTR}]`).forEach(btn => {
      btn.removeAttribute(DATA_ATTR);
    });
    buttonsTagged = false;

    const visible = Array.from(document.querySelectorAll(BUTTON_SELECTOR))
      .filter(el => !isHidden(el));
    if (!visible.length) return;
    visible.sort((a, b) => getDocumentTop(a) - getDocumentTop(b));
    visible.forEach((btn, i) => btn.setAttribute(DATA_ATTR, i));
    buttonsTagged = true;
    lastViewport = currentViewport;
    console.log(`[AscendyX] ${visible.length} button(s) tagged for ${currentViewport}.`);
  }

  // ── Core lock ─────────────────────────────────────────────────────────────
  function applyLock() {
    if (!activeText) return;

    const lightbox = document.querySelector(LIGHTBOX_SEL);
    if (!lightbox) { stopLock(); return; }

    const textarea = lightbox.querySelector(`#${TEXTAREA_ID}`)
      || document.querySelector(`#${TEXTAREA_ID}`);
    if (!textarea) return;

    if (textarea.style.pointerEvents !== 'none') {
      textarea.readOnly = true;
      textarea.style.setProperty('pointer-events',   'none',        'important');
      textarea.style.setProperty('resize',           'none',        'important');
      textarea.style.setProperty('overflow',         'hidden',      'important');
      textarea.style.setProperty('height',           '135px',       'important');
      textarea.style.setProperty('background-color', 'transparent', 'important');
      textarea.style.setProperty('user-select',      'none',        'important');
      textarea.style.setProperty('opacity',          '1',           'important');
      textarea.style.setProperty('visibility',       'visible',     'important');
    }

    if (textarea.value !== activeText) {
      const nativeSetter = Object.getOwnPropertyDescriptor(
        window.HTMLTextAreaElement.prototype, 'value'
      )?.set;
      if (nativeSetter) {
        nativeSetter.call(textarea, activeText);
      } else {
        textarea.readOnly = false;
        textarea.value = activeText;
        textarea.readOnly = true;
      }
      textarea.dispatchEvent(new Event('input',  { bubbles: true }));
      textarea.dispatchEvent(new Event('change', { bubbles: true }));
    }
  }

  function startLock(text) {
    activeText = text;
    if (lockInterval) clearInterval(lockInterval);

    let fastAttempts = 0;
    const fastPoll = setInterval(() => {
      fastAttempts++;
      const textarea = document.querySelector(`#${TEXTAREA_ID}`);
      if (textarea) {
        clearInterval(fastPoll);
        applyLock();
        lockInterval = setInterval(applyLock, 800);
      }
      if (fastAttempts > 30) clearInterval(fastPoll);
    }, 100);
  }

  function stopLock() {
    activeText = null;
    if (lockInterval) { clearInterval(lockInterval); lockInterval = null; }
    console.log('[AscendyX] Lock stopped.');
  }

  // ── UPDATED handleInteraction — retries tag if button not found ───────────
  function handleInteraction(e) {
    tagButtons();

    const btn = e.target.closest(`[${DATA_ATTR}]`);
    if (!btn) {
      const rawBtn = e.target.closest(BUTTON_SELECTOR);
      if (rawBtn) {
        console.warn('[AscendyX] Button found but not tagged — retrying tag.');
        buttonsTagged = false;
        tagButtons();
        const retryBtn = e.target.closest(`[${DATA_ATTR}]`);
        if (!retryBtn) return;
        const index = parseInt(retryBtn.getAttribute(DATA_ATTR), 10);
        const text  = buttonTexts[index];
        if (text === undefined) return;
        console.log(`[AscendyX] Button ${index} clicked (retry).`);
        setTimeout(() => startLock(text), 300);
      }
      return;
    }

    const index = parseInt(btn.getAttribute(DATA_ATTR), 10);
    const text  = buttonTexts[index];
    if (text === undefined) {
      console.warn(`[AscendyX] No text for button ${index}`);
      return;
    }
    console.log(`[AscendyX] Button ${index} clicked.`);
    setTimeout(() => startLock(text), 300);
  }

  document.addEventListener('click',    handleInteraction, true);
  document.addEventListener('touchend', handleInteraction, true);

  // ── UPDATED init — adds resize listener ───────────────────────────────────
  function init() {
    tagButtons();
    window.addEventListener('resize', () => tagButtons()); // ← NEW
    if (!buttonsTagged) {
      window.addEventListener('load', () => {
        tagButtons();
        if (!buttonsTagged) setTimeout(tagButtons, 2000);
      });
    }
  }

  document.readyState === 'loading'
    ? document.addEventListener('DOMContentLoaded', init)
    : init();

})();
</script>

<script>
function enforceInterFont(selector) {
  if (!document.getElementById('google-font-inter')) {
    const link = document.createElement('link');
    link.id = 'google-font-inter';
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap';
    document.head.appendChild(link);
  }
  const elements = document.querySelectorAll(selector);
  elements.forEach(el => {
    el.style.setProperty('font-family', "'Inter', sans-serif", 'important');
  });
}
enforceInterFont('span.sqsrte-text-color--custom.ai-style-change-1');
</script>
